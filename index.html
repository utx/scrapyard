<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Scrapyard Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one-screen game. Cinematic stage first, then picture left + paged story right
   (stacked on portrait screens). Committed deep-space look: void black, flight-suit orange, holo cyan, Imperial red. */
:root{
  --night:#07080f; --dusk:#0f1322; --dusk-2:#18203a; --line:#2b3658;
  --moon:#eaeef6; --moon-dim:#9ba7c4; --lantern:#ff9a3c; --lantern-ink:#2a1300;
  --magic:#62e4ff; --pup:#ffc861; --danger:#ff5a4f; --ok:#7de8b0;
  --f-display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',Verdana,Arial,sans-serif;
  --f-type:'JetBrains Mono',Menlo,Consolas,'Courier New',monospace;
  --panel:100%; --side:40%;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--moon);font-family:var(--f-body);font-size:18px;line-height:1.62;overflow:hidden;-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
#stage{position:relative;flex:0 0 auto;height:var(--panel);min-height:120px;transition:height 1.4s cubic-bezier(.6,.05,.3,1);overflow:hidden;background:#07081c}
#app.cine #stage{min-height:0}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:manipulation}
#main{flex:1 1 auto;min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--night);position:relative}
#app.cine #main{display:none}
#story{flex:1 1 auto;min-height:0;overflow-y:auto;padding-inline:16px;-webkit-overflow-scrolling:touch}
#controls.pending{visibility:hidden}
.col{max-width:42rem;margin-inline:auto;min-width:0}
#controls{flex:0 0 auto;border-top:1px solid var(--line);background:var(--dusk);padding-inline:16px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
#ctl:empty{display:none}
#controls:has(#ctl:empty){display:none}

/* ---------- story text ---------- */
.block{padding-block:16px 6px}
.block .pageturn{display:flex;width:fit-content;margin:6px 0 10px auto;font-family:var(--f-type);font-size:.9rem;padding:.45em 1em;border-color:var(--lantern);color:var(--lantern)}
.block .pageturn span{font-size:1.2em;line-height:1}
p.echo::before{content:'▸ '}
.block p{margin:0 0 .8em;opacity:0;transform:translateY(8px);transition:opacity .55s ease,transform .55s ease}
.block p.show{opacity:1;transform:none}
.say{padding-left:0}
.say .who{display:inline-block;font-family:var(--f-type);font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.05em .55em;margin-right:.55em;border-radius:4px;vertical-align:.12em;background:var(--dusk-2);color:var(--moon-dim)}
.say.luke{color:#ffc08a} .say.luke .who{background:#4a2610;color:var(--lantern)}
.say.r2 .who{background:#0f3a4a;color:var(--magic)} .say.r2{color:#bfefff;font-style:italic}
.say.threepio{color:#ffe2a0} .say.threepio .who{background:#4a3a10;color:var(--pup)}
.say.vader{color:#ffb3ad;font-weight:700} .say.vader .who{background:#4a0d0b;color:var(--danger)}
.say.you .who{background:#16424a;color:#9fe7df}
.say.varro .who,.say.trooper .who,.say.officer .who,.say.computer .who{background:#262c44;color:#d9dcf0}
.say.computer{font-family:var(--f-type);font-size:.92em}
p.big{font-family:var(--f-display);font-weight:900;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.15;color:var(--lantern);text-align:center;margin:.5em 0 .7em;text-wrap:balance}
p.end{font-family:var(--f-type);text-transform:uppercase;letter-spacing:.3em;text-align:center;color:var(--moon-dim);font-size:.8em;margin-top:1.4em}
p.tip{font-family:var(--f-type);font-size:.88em;line-height:1.5;color:var(--magic);border:1px dashed rgba(183,165,255,.5);border-radius:8px;padding:.6em .85em}
p.cmd{font-family:var(--f-type);color:var(--lantern);font-size:.95em;margin-bottom:.4em}
p.echo{font-family:var(--f-type);color:var(--moon-dim);font-size:.85em}
p.room{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--moon);font-size:1.35em;margin-bottom:.3em}
p.puz{font-family:var(--f-body);background:rgba(98,228,255,.07);border:1px solid rgba(98,228,255,.45);border-radius:10px;padding:.7em .9em;color:#e6fbff;margin-bottom:.6em}
p.puz b{color:var(--magic)}
p.clue{font-family:var(--f-type);font-size:.9em;color:var(--ok)}
em{font-style:italic}
.vw{font:inherit;color:var(--lantern);background:none;border:0;padding:0;margin:0;cursor:pointer;border-bottom:2px dotted var(--lantern);border-radius:0;line-height:1.2}
.vw.got{color:#ffd59a;border-bottom-style:solid;border-bottom-color:rgba(255,213,154,.7)}
.vw:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}

/* ---------- controls ---------- */
.choices{display:grid;gap:8px}
.btn{font:inherit;font-size:1rem;line-height:1.35;text-align:left;padding:.7em 1em;border-radius:10px;background:var(--dusk-2);color:var(--moon);border:1px solid var(--line);cursor:pointer;display:flex;gap:.7em;align-items:baseline;transition:border-color .15s,transform .1s,background .15s}
.btn:hover{border-color:var(--lantern);background:#282c6a}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible,.hudb:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
.btn .k{font-family:var(--f-type);font-size:.8em;color:var(--lantern);min-width:1.1em}
.btn.primary{background:var(--lantern);color:var(--lantern-ink);border-color:var(--lantern);font-weight:600;justify-content:center;text-align:center}
.btn.primary:hover{background:#ffc26a}
.btn.ghost{background:transparent}
.btn.small{font-size:.9rem;padding:.45em .8em;align-items:center;justify-content:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.typebox{display:flex;gap:8px;align-items:stretch}
.typebox .pr{font-family:var(--f-type);color:var(--lantern);font-size:1.3rem;display:grid;place-items:center;padding-inline:2px}
input.t{flex:1;min-width:0;font-family:var(--f-type);font-size:1.2rem;background:#090a22;color:var(--moon);border:2px solid var(--line);border-radius:10px;padding:.5em .75em;outline:none}
input.t:focus{border-color:var(--lantern);box-shadow:0 0 0 3px rgba(255,179,71,.18)}
input.t::placeholder{color:#6f6c93}
.hintline{font-family:var(--f-type);font-size:.82rem;color:var(--moon-dim);margin-top:8px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-family:var(--f-type);font-size:.85rem;padding:.3em .75em;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--moon-dim);cursor:pointer}
.chip:hover{color:var(--moon);border-color:var(--magic)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:520px){.levels{grid-template-columns:1fr}}
.lv{flex-direction:column;align-items:flex-start;gap:.15em}
.lv b{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:1.2rem;color:var(--lantern)}
.lv span{font-size:.88rem;color:var(--moon-dim)}
label.q{display:block;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:1.35rem;margin-bottom:8px}

/* spell card */
.spell{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.sp-title{font-family:var(--f-type);text-transform:uppercase;letter-spacing:.25em;font-size:.78rem;color:var(--magic);text-align:center}
.sp-def{margin:0;text-align:center;font-size:1.02rem;text-wrap:balance}
.sp-def b{color:var(--moon);font-weight:600}
.tiles{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tile{width:1.9em;height:2.3em;display:grid;place-items:center;font-family:var(--f-type);font-weight:700;font-size:1.25rem;border-radius:6px;background:#090a22;border:1px solid var(--line);color:#5f5c86;transition:background .15s,color .15s,box-shadow .2s}
.tile.shown{color:#8a86b8}
.tile.typed{color:var(--moon)}
.tile.on{background:var(--magic);border-color:var(--magic);color:#04222b;box-shadow:0 0 14px rgba(98,228,255,.7)}
.tile.bad{background:var(--danger);color:#3a0808;border-color:var(--danger)}
.spell.cast .tile{background:#e9fbff;color:#04222b;box-shadow:0 0 22px rgba(98,228,255,.9)}
.sp-msg{min-height:1.3em;text-align:center;font-family:var(--f-type);font-size:.88rem;color:var(--moon-dim)}

/* puzzle terminal */
.pz{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.pz-title{font-family:var(--f-type);text-transform:uppercase;letter-spacing:.22em;font-size:.76rem;color:var(--magic);text-align:center}
.pz .typebox input{font-size:1.4rem;letter-spacing:.08em}
.pz-msg{min-height:1.3em;font-family:var(--f-type);font-size:.86rem;color:var(--moon-dim);text-align:center}
.pz-msg.bad{color:var(--danger)} .pz-msg.good{color:var(--ok)}
.pz-hint{font-size:.95rem;line-height:1.45;background:rgba(255,200,97,.08);border:1px dashed rgba(255,200,97,.5);border-radius:8px;padding:.55em .8em;color:#ffe9bf}
.pz-hint b{color:var(--pup)}
.pz.done input{border-color:var(--ok)}
/* typing run (chase / dance) */
.run{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.run .cue{margin:0;text-align:center;font-size:1rem;min-height:1.6em;text-wrap:balance}
.run .word{font-family:var(--f-type);font-weight:700;font-size:clamp(1.8rem,7vw,2.6rem);letter-spacing:.14em;text-align:center;text-transform:uppercase;line-height:1.1}
.run .word i{font-style:normal;color:#77739f}
.run .word i.ok{color:var(--ok)}
.run .word i.no{color:var(--danger)}
.timer{height:8px;background:#090a22;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:var(--lantern);transform-origin:left center}
.run .meta{display:flex;justify-content:space-between;font-family:var(--f-type);font-size:.82rem;color:var(--moon-dim)}
.hs-list{display:grid;gap:6px}
.hs-list .btn.found{opacity:.6;border-style:dashed}

/* ---------- HUD, captions, overlays ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;pointer-events:none}
#hud > *{pointer-events:auto}
#chap{font-family:var(--f-type);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--moon);background:rgba(8,9,30,.62);padding:.35em .7em;border-radius:6px;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(4px)}
.hudr{display:flex;gap:6px}
.hudb{font-family:var(--f-type);font-size:.8rem;color:var(--moon);background:rgba(8,9,30,.62);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:.35em .75em;cursor:pointer;display:flex;align-items:center;gap:.4em;backdrop-filter:blur(4px)}
.hudb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hudb .n{color:var(--lantern);font-weight:700}
.hudb.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18);border-color:var(--lantern)}}
#caption{position:absolute;left:0;right:0;bottom:0;padding-inline:20px;padding-block:18vh 9vh;background:linear-gradient(to bottom,rgba(4,5,12,0),rgba(4,5,12,.8) 55%);text-align:center;font-family:var(--f-display);font-size:clamp(1.35rem,4.2vw,2.5rem);line-height:1.2;color:var(--moon);text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8);transition:opacity .7s ease;text-wrap:balance;pointer-events:none}
#caption{font-weight:800;letter-spacing:.02em}
#caption.boom{font-size:clamp(2.8rem,12vw,7rem);font-weight:900;color:var(--lantern);letter-spacing:.02em;transform:rotate(-3deg)}
#caption small{display:block;font-family:var(--f-type);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--moon-dim);margin-top:.8em;opacity:.8}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding-inline:16px;background:radial-gradient(ellipse at 50% 55%,rgba(4,5,12,.2),rgba(4,5,12,.8))}
#title .kicker{font-family:var(--f-type);text-transform:uppercase;letter-spacing:.3em;font-size:.78rem;color:var(--moon-dim);margin:0}
#title h1{margin:0;font-family:var(--f-display);font-weight:400;line-height:.9;color:var(--moon);text-shadow:0 4px 30px rgba(0,0,0,.6)}
#title h1{font-weight:900;text-transform:uppercase;letter-spacing:.01em}
#title h1 .t1{display:block;font-size:clamp(2rem,7vw,4.2rem);letter-spacing:.2em;color:var(--moon)}
#title h1 .t2{display:block;font-size:clamp(4.2rem,20vw,11rem);line-height:.82;color:var(--lantern);text-shadow:0 0 50px rgba(255,120,40,.45),0 5px 0 #5a2200}
#title .tag{font-style:italic;font-size:clamp(1.05rem,3vw,1.35rem);margin:4px 0 8px;max-width:30ch}
#title .tbtns{display:grid;gap:8px;min-width:min(320px,100%)}
#title .fine{font-family:var(--f-type);font-size:.75rem;color:var(--moon-dim);margin:0;letter-spacing:.08em}
#card{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,7,24,.9);backdrop-filter:blur(6px);padding-inline:16px;animation:fade .6s ease}
#card .cc{text-align:center;display:grid;gap:14px;max-width:34rem}
#card .cn{font-family:var(--f-type);text-transform:uppercase;letter-spacing:.35em;font-size:.85rem;color:var(--magic)}
#card h2{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(2rem,7vw,3.4rem);line-height:1.05;color:var(--moon);text-wrap:balance}
#card .cs{font-family:var(--f-type);font-size:.85rem;color:var(--moon-dim)}
#card .btn{justify-self:center;min-width:12rem}
@keyframes fade{from{opacity:0}to{opacity:1}}
#pop{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:15;width:min(26rem,calc(100% - 32px));background:#1d1f52;border:1px solid var(--lantern);border-radius:12px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:fade .25s ease}
#pop .pw{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap}
#pop .pword{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--lantern)}
#pop .ptype{font-family:var(--f-type);font-size:.78rem;color:var(--moon-dim);font-style:italic}
#pop p{margin:.3em 0 0;font-size:1rem;line-height:1.45}
#pop .pex{font-family:var(--f-type);font-size:.78rem;color:var(--ok);margin-top:.5em}
#toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);z-index:16;font-family:var(--f-type);font-size:.85rem;background:var(--ok);color:#06301f;padding:.45em .9em;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:fade .25s ease;white-space:nowrap}
#book{position:absolute;inset:0;z-index:30;background:rgba(4,5,18,.72);display:flex;justify-content:flex-end;animation:fade .2s}
#book .sheet{width:min(460px,100%);height:100%;background:var(--dusk);border-left:1px solid var(--line);display:flex;flex-direction:column}
#book header{padding:16px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#book h3{margin:0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.6rem;line-height:1.05}
#book .rank{font-family:var(--f-type);font-size:.78rem;color:var(--moon-dim);letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:6px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--f-type);font-size:.85rem;background:transparent;color:var(--moon-dim);border:1px solid var(--line);border-radius:99px;padding:.3em .9em;cursor:pointer}
.tab[aria-selected="true"]{background:var(--lantern);color:var(--lantern-ink);border-color:var(--lantern)}
.bbody{overflow-y:auto;padding:12px 16px 24px;flex:1;min-height:0}
.clue-i{display:grid;grid-template-columns:2em 1fr;gap:4px;padding:10px 0;border-bottom:1px dashed rgba(183,165,255,.2);font-size:.98rem;line-height:1.45}
.clue-i b{font-family:var(--f-type);color:var(--lantern)}
.word-i{padding:10px 0;border-bottom:1px dashed rgba(183,165,255,.2)}
.word-i .w{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--lantern)}
.word-i .pos{font-family:var(--f-type);font-size:.75rem;color:var(--moon-dim);font-style:italic;margin-left:.5em}
.word-i .d{font-size:.95rem;line-height:1.4;margin-top:2px}
.word-i.lock .w{color:#4f4c7a;letter-spacing:.2em}
.word-i.lock .d{color:#6f6c93;font-style:italic}
.empty{color:var(--moon-dim);font-style:italic}

/* Side-by-side on laptops and landscape tablets: picture left, book page right */
@media (min-width:760px) and (min-aspect-ratio:11/10){
  #app:not(.cine){flex-direction:row}
  #app:not(.cine) #stage{height:auto;flex:1 1 auto;min-width:0;min-height:0;transition:none;background:radial-gradient(ellipse at 50% 50%,#0d1122,#03040a)}
  #app:not(.cine) #main{flex:0 0 max(360px,var(--side));border-left:1px solid var(--line);transition:flex-basis 1.4s cubic-bezier(.6,.05,.3,1)}
  #app:not(.cine) #story{padding-inline:24px}
  #app:not(.cine) #controls{padding-inline:24px}
}
@media (max-width:600px){body{font-size:17px} #controls{padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.block p{transition:none;transform:none}#stage{transition:none}.shake,.hudb.bump{animation:none}}
</style>
</head><body>

<div id="app" class="cine">
  <div id="stage">
    <canvas id="cv" aria-label="Animated picture of the story scene"></canvas>
    <div id="hud" hidden>
      <div id="chap">Prologue</div>
      <div class="hudr">
        <button class="hudb" id="bookBtn" type="button" aria-label="Open datapad"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/></svg><span>Datapad</span> <span class="n" id="wcount">0</span></button>
        <button class="hudb" id="sndBtn" type="button" aria-label="Sound on"><svg viewBox="0 0 24 24" id="sndIcon"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg></button>
      </div>
    </div>
    <div id="caption" aria-live="polite"></div>
    <div id="title">
      <p class="kicker">A Star Wars Text Adventure</p>
      <h1><span class="t1">The Scrapyard</span><span class="t2">Signal</span></h1>
      <p class="tag">Tonight, a Rebel hero falls out of the sky. Straight into your scrapyard.</p>
      <div class="tbtns" id="tbtns"></div>
      <p class="fine">Sound on · Keyboard at the ready · Brain switched on</p>
    </div>
  </div>
  <div id="main">
    <div id="story"><div class="col" id="log" aria-live="polite"></div></div>
    <div id="controls"><div class="col" id="ctl"></div></div>
    <div id="pop" hidden></div>
  </div>
  <div id="toast" hidden></div>
  <div id="card" hidden></div>
  <div id="book" hidden></div>
</div>
<script>
/* ===================== ART: every picture is drawn in code ===================== */
const CV = document.getElementById('cv');
const X = CV.getContext('2d');
let W = 0, H = 0, DPR = 1, SHAKE = 0, FLASH = 0;
let HOT = {};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SCENES = {};
let SC = { name: 'prologue', p: {}, t0: 0 };
function setScene(name, p) { SC = { name, p: p || {}, t0: performance.now() / 1000 }; }

function resizeCanvas() {
  const r = CV.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, r.width); H = Math.max(1, r.height);

  if (data.G && data.G.name && data.G.node && N[data.G.node]) {
    G = data.G; if (!G.stats) G.stats = { solved: 0, clean: 0 };
    $('#title').hidden = true; app.classList.remove('cine'); $('#hud').hidden = false; updateCount(); setTimeout(layoutCanvas, 30);
    const nd = G.node; G.chapter = -1; go(nd);
  } else showTitle();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ G: JSON.parse(JSON.stringify(G)) }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(bootGame);
else bootGame(window.claude && window.claude.hot ? window.claude.hot.data : {});
</script>
